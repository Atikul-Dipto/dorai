<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DorAI match review</title>
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <!-- The product matching engine's manual review (worker/catalog.ts): the
       owner decides the matches it wasn't sure of. Calls /api/pp/review with
       the ADMIN_TOKEN, kept in this browser only. -->
  <style>
    :root { --purple: #522d60; --plum: #80426e; --peach: #f2a67b; --gold: #ffd38b; --ink: #2e1a36; --muted: #6f5f77; --line: #ece1e8; --tint: #faf5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; color: var(--ink); background: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { margin: 0 0 4px; color: var(--purple); font-size: 24px; }
    .muted { color: var(--muted); }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; height: 40px; padding: 0 12px; border: 1px solid #dccbd6; border-radius: 10px; font: inherit; }
    button { height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { color: #fff; background: var(--plum); }
    .ghost { color: var(--ink); background: #fff; border-color: #dccbd6; }
    .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
    .counts span { padding: 4px 12px; background: var(--tint); border-radius: 999px; font-size: 13px; }
    .review { margin: 0 0 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
    .review header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .score { padding: 2px 10px; color: #fff; background: var(--purple); border-radius: 999px; font-weight: 700; font-size: 13px; }
    .score.low { color: var(--ink); background: var(--peach); }
    .reason { padding: 2px 8px; background: var(--tint); border-radius: 999px; font-size: 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .side h3 { margin: 0 0 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .offer { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .offer:first-of-type { border-top: 0; }
    .offer img { width: 64px; height: 64px; object-fit: contain; background: var(--tint); border-radius: 8px; }
    .offer a { font-weight: 600; color: var(--ink); text-decoration: none; }
    .offer a:hover { color: var(--plum); }
    .tag { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .daraz { background: var(--peach); } .cartup { background: var(--gold); } .othoba { background: #e3c7da; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .empty { padding: 24px; background: var(--tint); border-radius: 14px; text-align: center; }
    @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Match review</h1>
    <p class="muted">Listings the product matching engine wasn't sure of (confidence 0.40–0.79). "Same product" links it; "Different" sends it back through the engine without that product.</p>
    <form id="login"><input id="token" type="password" placeholder="Admin token" autocomplete="off" /><button class="primary">Open</button></form>
    <div class="counts" id="counts"></div>
    <div id="list"></div>
  </main>
  <script>
    const KEY = 'dorai:admin-token'
    const money = (v) => (v == null ? '' : `৳${Math.round(v).toLocaleString('en-US')}`)
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    let token = ''
    try { token = localStorage.getItem(KEY) ?? '' } catch {}

    const offer = (o) => `<div class="offer"><img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" />
      <div><span class="tag ${esc(o.site)}">${esc(o.site)}</span> <a href="${esc(o.url)}" target="_blank" rel="noreferrer">${esc(o.name)}</a>
      <div class="muted">${esc(o.brand || 'no brand')} · ${money(o.price)}</div></div></div>`

    async function load() {
      const list = document.getElementById('list')
      if (!token) return
      const r = await fetch('/api/pp/review', { headers: { authorization: `Bearer ${token}` } })
      if (r.status === 403) { list.innerHTML = '<p class="empty">That token isn\'t the admin token.</p>'; return }
      const data = await r.json()
      document.getElementById('login').hidden = true
      const c = data.listings
      document.getElementById('counts').innerHTML = [
        `${data.products?.n ?? 0} products (${data.products?.shared ?? 0} with 2+ offers)`,
        `${c.auto ?? 0} matched automatically`, `${c.manual ?? 0} by you`, `${c.new ?? 0} new products`,
        `${c.review ?? 0} waiting for review`, `${c.waiting ?? 0} not processed yet`,
      ].map((t) => `<span>${t}</span>`).join('')
      list.innerHTML = data.reviews.length ? data.reviews.map((rv) => `
        <section class="review" data-id="${rv.id}">
          <header><span class="score ${rv.level}">${rv.score.toFixed(2)} · ${esc(rv.level)}</span>${rv.reasons.map((x) => `<span class="reason">${esc(x)}</span>`).join('')}</header>
          <div class="pair">
            <div class="side"><h3>This listing</h3>${offer(rv)}</div>
            <div class="side"><h3>Is it this product? ${esc(rv.product.model ? '· model ' + rv.product.model : '')}</h3>${(rv.product.offers.length ? rv.product.offers : [{ ...rv.product, site: '' }]).map(offer).join('')}</div>
          </div>
          <div class="actions"><button class="primary" data-decision="same">Same product</button><button class="ghost" data-decision="different">Different</button></div>
        </section>`).join('') : '<p class="empty">Nothing to review right now.</p>'
    }

    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault()
      token = document.getElementById('token').value.trim()
      try { localStorage.setItem(KEY, token) } catch {}
      load()
    })
    document.getElementById('list').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-decision]')
      if (!b) return
      const section = b.closest('.review')
      section.querySelectorAll('button').forEach((x) => (x.disabled = true))
      await fetch('/api/pp/review', { method: 'POST', headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' }, body: JSON.stringify({ id: Number(section.dataset.id), decision: b.dataset.decision }) })
      section.remove()
      if (!document.querySelector('.review')) load()
    })
    load()
  </script>
</body>
</html>
